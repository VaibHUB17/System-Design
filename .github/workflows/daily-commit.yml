name: Daily Commit

on:
  schedule:
    # Runs daily at 14:15 UTC (19:45 IST)
    - cron: '15 14 * * *'
  workflow_dispatch: # Allows manual trigger from GitHub Actions tab

permissions:
  contents: write

jobs:
  daily-commit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: master
          fetch-depth: 0
          token: ${{ secrets.AUTO_COMMIT_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name "Vaibhav Shivhare"
          git config user.email "vaibhavshivhare1709@gmail.com"

      - name: Update log, commit and push
        run: |
          # Options A & C: Curated pool of realistic commit messages + system design tips & quotes
          MESSAGES=(
            "docs: update system design architecture notes"
            "docs(patterns): revise behavioral and structural design pattern summaries"
            "docs(solid): clarify dependency inversion and interface segregation"
            "refactor: optimize data flow and system component documentation"
            "docs(cache): add notes on cache invalidation and redis strategies"
            "chore: routine repository maintenance and notes sync"
            "docs(oops): refine abstraction and polymorphism examples"
            "style: clean up formatting across system design markdown docs"
            "docs(scalability): outline horizontal vs vertical scaling trade-offs"
            "docs(consistency): review eventual consistency and raft consensus"
            "docs(db): summarize indexing, sharding, and partitioning strategies"
            "chore(sync): automated repository activity log update"
            "docs(microservices): document api gateway and circuit breaker patterns"
            "docs(network): review load balancing algorithms and reverse proxies"
            "tip: 'Premature optimization is the root of all evil' - Donald Knuth"
            "tip: CAP theorem - balance consistency and availability under network partition"
            "tip: 'Simplicity is prerequisite for reliability' - Edsger W. Dijkstra"
            "tip: In distributed systems, network partitions are inevitable - design for failure"
            "tip: 'Make it work, make it right, make it fast' - Kent Beck"
            "tip: Use Bloom Filters to prevent expensive disk lookups for nonexistent keys"
            "tip: Prefer composition over inheritance for decoupled architecture"
            "tip: Two hard things in CS: cache invalidation and naming things - Phil Karlton"
            "tip: Rate limiting algorithms: Token Bucket, Leaky Bucket, and Sliding Window"
            "tip: Consistent Hashing minimizes key remapping during server scaling"
            "docs(concurrency): examine optimistic vs pessimistic locking approaches"
            "docs(queues): review event-driven decoupling using message brokers"
            "tip: Design systems around idempotency to handle network retries safely"
            "docs(reliability): review SLOs, SLAs, and error budget definitions"
            "docs(storage): compare row-oriented vs columnar storage architectures"
            "chore(log): record daily system design learning milestone"
          )

          # Pick a random message from pool
          RANDOM_INDEX=$((RANDOM % ${#MESSAGES[@]}))
          CHOSEN_MSG="${MESSAGES[$RANDOM_INDEX]}"

          # Append entry to activity log
          TIMESTAMP=$(date -u +"%Y-%m-%d %H:%M:%S UTC")
          mkdir -p .github
          echo "[$TIMESTAMP] $CHOSEN_MSG" >> .github/activity.log

          # Stage, commit and push
          git add .github/activity.log
          git commit -m "$CHOSEN_MSG"
          git pull --rebase origin master || true
          git push origin master
